<script>
(function(){
  function buildPanel(startX){
    var p=document.createElement('div');
    p.id='__slide-overlay';
    p.style.position='fixed';p.style.top='0';p.style.bottom='0';p.style.left='0';p.style.width='100%';
    p.style.background='oklch(98% 0.006 250)';p.style.zIndex='9999';p.style.pointerEvents='none';
    p.style.transform='translateX('+startX+')';
    document.body.appendChild(p);
    return p;
  }
  function revealLeftToRight(){
    var p=buildPanel('0%');
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        p.style.transition='transform 0.55s cubic-bezier(.65,0,.35,1)';
        p.style.transform='translateX(100%)';
      });
    });
    setTimeout(function(){ p.remove(); }, 600);
  }
  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded', revealLeftToRight);
  } else {
    revealLeftToRight();
  }
})();
</script>
</helmet>

<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { doc: 'resume' };

  renderVals() {
    const isResume = this.state.doc === 'resume';
    return {
      activeUrl: isResume ? '../assets/docs/Tony_Resume.pdf' : '../assets/docs/Tony_CV.pdf',
      showResume: (e) => { e.preventDefault(); this.setState({ doc: 'resume' }); },
      showCv: (e) => { e.preventDefault(); this.setState({ doc: 'cv' }); },
